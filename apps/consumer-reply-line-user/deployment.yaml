apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-reply-line-user
  namespace: default
  labels:
    app: consumer-reply-line-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-reply-line-user
  template:
    metadata:
      labels:
        app: consumer-reply-line-user
    spec:
      # Uses default cluster DNS (kube-dns). External names (LINE API) resolve
      # reliably via CoreDNS per-zone forward rules - see
      # infrastructure/networking/coredns/configmap-custom.yaml. The per-pod
      # public resolver (1.1.1.1) was removed: on any kube-dns blip it
      # NXDOMAIN'd the INTERNAL NATS name and permanently broke NATS
      # connectivity until a pod restart.
      containers:
        - name: consumer-reply-line-user
          image: chokchaifa/consumer-reply-line-user:v1.1.0-64.8c4c6ea # {"$imagepolicy": "flux-system:consumer-reply-line-user"}
          env:
            - name: NATS_URL
              value: nats://nats.core.svc.cluster.local:4222
            # nats-auth (copied into default) and line-webhook-secret are created
            # directly in-cluster (kubectl create secret) and deliberately NOT
            # committed to git.
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: username
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: password
            - name: LINE_CHANNEL_SECRET
              valueFrom:
                secretKeyRef:
                  name: line-webhook-secret
                  key: LINE_CHANNEL_SECRET
            - name: LINE_CHANNEL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: line-webhook-secret
                  key: LINE_CHANNEL_ACCESS_TOKEN
            # LINE's servers fetch generated images over the public internet,
            # so this must be the cloudflared tunnel hostname, not the
            # in-cluster service DNS name.
            - name: IMAGE_BASE_URL
              value: https://line-webhook.chokchai-dev.xyz
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
      restartPolicy: Always
