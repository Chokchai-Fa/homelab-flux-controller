apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: core
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          # JetStream enabled but MEMORY-only: store_dir is a tmpfs emptyDir
          # (js-store below) and max_file_store is 0 in the config, so nothing
          # touches the SD card. No PVC on purpose.
          args:
            - "-c"
            - "/etc/nats/nats-server.conf"
          env:
            # nats-auth is created directly in-cluster (kubectl create
            # secret) and deliberately NOT committed to git - see
            # configmap.yaml for why.
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: username
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: password
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          volumeMounts:
            - name: config
              mountPath: /etc/nats/nats-server.conf
              subPath: nats-server.conf
            - name: js-store
              mountPath: /data
          # NATS's built-in /healthz (js-enabled-only checks JetStream, not
          # just the TCP port) - added after an incident where a client
          # subscribe silently left a JetStream consumer uncreated on the
          # server during a burst of concurrent client redeploys. These
          # probes don't catch that client-side race directly, but they do
          # give Kubernetes a way to restart this pod if JetStream itself
          # ever degrades or wedges, rather than leaving a half-broken
          # broker serving traffic on a healthy-looking TCP port.
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: 8222
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            # Bumped from 256Mi for JetStream's 64 MiB memory store + the
            # tmpfs js-store + server overhead.
            limits:
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: nats-config
        # RAM-backed JetStream store so nothing is written to the SD card.
        # Wiped on pod restart (same as the previous in-memory pub/sub state).
        - name: js-store
          emptyDir:
            medium: Memory
            sizeLimit: 96Mi
